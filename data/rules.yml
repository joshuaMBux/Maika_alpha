version: "3.1"

rules:

- rule: decir despedida cuando el usuario se despide
  steps:
  - intent: despedida
  - action: action_reset_juego_activo
  - action: utter_despedida

- rule: decir que soy un bot cuando el usuario pregunta si es un bot
  steps:
  - intent: desafio_bot
  - action: utter_soy_un_bot

# Nuevas reglas para educación bíblica
- rule: buscar versículo cuando se pide
  steps:
  - intent: preguntar_versiculo
  - action: action_buscar_versiculo

- rule: obtener historia bíblica cuando se pide
  steps:
  - intent: pedir_historia_biblica
  - action: action_obtener_historia_biblica

- rule: explicar concepto bíblico cuando se pregunta
  steps:
  - intent: preguntar_concepto_biblico
  - action: action_explicar_concepto

- rule: generar devocional cuando se pide
  steps:
  - intent: pedir_devocional
  - action: action_generar_devocional

- rule: obtener eventos cuando se preguntan
  steps:
  - intent: preguntar_eventos
  - action: action_obtener_eventos

- rule: obtener horarios cuando se piden
  steps:
  - intent: pedir_horarios
  - action: action_obtener_horarios

- rule: oración guiada cuando se pide
  steps:
  - intent: preguntar_oracion
  - action: action_oracion_guiada

- rule: ayuda espiritual cuando se pide
  steps:
  - intent: pedir_ayuda_espiritual
  - action: action_ayuda_espiritual

- rule: estudio bíblico cuando se pide
  steps:
  - intent: preguntar_estudio_biblico
  - action: action_estudio_biblico

- rule: consejo pastoral cuando se pide
  steps:
  - intent: pedir_consejo_pastoral
  - action: action_consejo_pastoral

# Nuevas reglas para funcionalidades avanzadas
- rule: buscar por tema cuando se pide
  steps:
  - intent: buscar_por_tema
  - action: action_buscar_por_tema

- rule: preguntar nivel cuando se pide quiz
  steps:
  - intent: start_quiz
  - action: action_set_juego_activo
  - action: utter_preguntar_nivel
  - action: action_set_esperando_nivel

- rule: mostrar estadísticas del usuario
  steps:
  - intent: mostrar_estadisticas
  - action: action_show_stats

- rule: confirmar respuesta cuando es útil
  steps:
  - intent: confirmar_respuesta
  - action: action_confirm_response

- rule: negar respuesta cuando no es útil
  steps:
  - intent: negar_respuesta
  - action: action_confirm_response

- rule: procesar respuesta de quiz
  steps:
  - intent: responder_quiz
  - action: action_process_quiz_answer

- rule: fallback cuando no entiende
  steps:
  - intent: fallback
  - action: action_fallback

# Motor dinámico educativo
- rule: mostrar verso del día
  steps:
  - intent: aprender_verso
  - action: action_set_juego_activo
  - action: action_mostrar_verso

- rule: repasar verso (SRS)
  condition:
  - slot_was_set:
    - juego_activo: srs
  steps:
  - intent: repasar_verso
  - action: action_repaso_verso

- rule: preguntar nivel cuando se pide trivia
  steps:
  - intent: jugar_trivia
  - action: action_set_juego_activo
  - action: utter_preguntar_nivel
  - action: action_set_esperando_nivel

- rule: mision del dia
  steps:
  - intent: empezar_mision
  - action: action_set_juego_activo
  - action: action_mision_hoy

- rule: bingo de valores
  steps:
  - intent: bingo_valores
  - action: action_set_juego_activo
  - action: action_bingo



# Nuevas reglas cristianas
- rule: responder agradecimiento
  steps:
  - intent: agradecer
  - action: utter_agradecer

- rule: recibir testimonio
  steps:
  - intent: pedir_testimonio
  - action: utter_testimonio

- rule: pedir alabanza
  steps:
  - intent: pedir_alabanza
  - action: utter_alabanza

- rule: guiar a salvación
  steps:
  - intent: preguntar_como_ser_salvo
  - action: utter_salvacion

- rule: dar consejo bíblico
  steps:
  - intent: pedir_consejo_biblico
  - action: utter_consejo_biblico

- rule: compartir promesa bíblica
  steps:
  - intent: pedir_promesa_biblica
  - action: utter_promesa_biblica

- rule: dar fortaleza
  steps:
  - intent: pedir_fortaleza
  - action: utter_fortaleza

# Reglas para conversaciones naturales con Maika
- rule: responder estado de Maika
  steps:
  - intent: preguntar_estado_maika
  - action: action_respuesta_natural_maika

- rule: responder qué hace Maika
  steps:
  - intent: preguntar_que_hace_maika
  - action: action_respuesta_natural_maika

- rule: mostrar guía de Maika cuando preguntan qué puede hacer
  steps:
  - intent: pedir_guia_maika
  - action: utter_guia_maika

- rule: conversación cotidiana - escuela
  steps:
  - intent: smalltalk_escuela
  - action: utter_smalltalk_escuela

- rule: conversación cotidiana - amigos
  steps:
  - intent: smalltalk_amigos
  - action: utter_smalltalk_amigos

- rule: conversación cotidiana - familia
  steps:
  - intent: smalltalk_familia
  - action: utter_smalltalk_familia

- rule: conversación cotidiana - estrés / ansiedad
  steps:
  - intent: smalltalk_estres
  - action: utter_smalltalk_estres

- rule: conversación cotidiana - aburrimiento
  steps:
  - intent: smalltalk_aburrido
  - action: utter_smalltalk_aburrido

- rule: conversación cotidiana - logros
  steps:
  - intent: smalltalk_logro
  - action: utter_smalltalk_logro

- rule: dar sugerencias de Maika
  steps:
  - intent: pedir_sugerencias_maika
  - action: action_respuesta_natural_maika

- rule: charlar informalmente con Maika
  steps:
  - intent: charlar_informal
  - action: action_respuesta_natural_maika

- rule: responder cariño a Maika
  steps:
  - intent: expresar_cariño_maika
  - action: action_respuesta_natural_maika

# Reglas para curiosidades bíblicas
- rule: contar curiosidad bíblica
  steps:
  - intent: pedir_curiosidad_biblica
  - action: action_contar_curiosidad_biblica

# Reglas para adivinanzas cristianas
- rule: hacer adivinanza cristiana
  steps:
  - intent: pedir_adivinanza_cristiana
  - action: action_adivinanza_cristiana
- rule: responder adivinanza cristiana
  condition:
  - slot_was_set:
    - juego_activo: adivinanza
  steps:
  - intent: responder_adivinanza
  - action: action_responder_adivinanza
- rule: contar curiosidad por categoría
  steps:
  - intent: pedir_curiosidad_por_categoria
  - action: action_contar_curiosidad_biblica
